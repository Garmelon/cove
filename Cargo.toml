[workspace]
resolver = "3"
members = ["cove", "cove-*"]

[workspace.package]
version = "0.10.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
clap = { version = "4.6.5", features = ["derive", "deprecated"] }
cookie = "0.18.1"
cove = { path = "./cove" }
cove-config = { path = "./cove-config" }
cove-input = { path = "./cove-input" }
cove-macro = { path = "./cove-macro" }
crossterm = "0.29.0"
directories = "6.0.0"
edit = "0.1.5"
euphoxide = { git = "https://git.plugh.de/Garmelon/euphoxide.git" }
euphoxide-client = { git = "https://git.plugh.de/Garmelon/euphoxide.git" }
jiff = "0.2.35"
linkify = "0.11.0"
log = { version = "0.4.33", features = ["std"] }
open = "5.4.0"
parking_lot = "0.12.5"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rusqlite = { version = "0.40.1", features = ["bundled", "time"] }
rustls = "0.23.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_either = "0.2.1"
serde_json = "1.0.151"
syn = "3.0.3"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
unicode-width = "0.2.2"

[workspace.dependencies.toss]
git = "https://git.plugh.de/Garmelon/toss.git"
tag = "v0.4.0"

[workspace.dependencies.vault]
git = "https://git.plugh.de/Garmelon/vault.git"
# tag = "v0.4.0"
features = ["tokio"]

[workspace.lints]
rust.unsafe_code = { level = "forbid", priority = 1 }
# Lint groups
rust.deprecated-safe = "warn"
rust.future-incompatible = "warn"
rust.keyword-idents = "warn"
rust.nonstandard-style = "warn"
rust.refining-impl-trait = "warn"
rust.rust-2018-idioms = "warn"
rust.unknown-or-malformed-diagnostic-attributes = "warn"
rust.unused = "warn"
# Individual lints
rust.redundant_imports = "warn"
rust.redundant_lifetimes = "warn"
rust.single_use_lifetimes = "warn"
rust.unit_bindings = "warn"
rust.unnameable_types = "warn"
rust.unused_crate_dependencies = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_qualifications = "warn"
# Clippy
clippy.use_self = "warn"

[profile.dev.package."*"]
opt-level = 3
